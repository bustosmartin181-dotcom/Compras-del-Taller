name: Compilar APK Compras del Taller

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Leer la versión de la app (sale del index.html)
        id: ver
        run: echo "version=$(grep -oP "const VERSION = '\K[^']+" index.html)" >> "$GITHUB_OUTPUT"

