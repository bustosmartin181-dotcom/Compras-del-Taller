      - name: Armar el proyecto Android con Capacitor
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "Compras del Taller" com.martinbustos.comprastaller --web-dir www
          npx cap add android

      - name: Poner el ícono de la app
        run: |
          cd app
          npm install --no-save sharp @capacitor/assets
          mkdir -p iconos
          cat > iconos/icon-only.svg <<'FIN'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><defs><linearGradient id="g" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="0.6" stop-color="#15803d"/><stop offset="1" stop-color="#14532d"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#g)"/><g transform="translate(512 540) scale(0.62) translate(-512 -512)">
              <!-- tortita -->
              <ellipse cx="420" cy="330" rx="165" ry="120" fill="#f4b54a" stroke="#8a4b12" stroke-width="18"/>
              <path d="M330 300 q40 -30 80 0 M420 280 q40 -30 80 0 M370 360 q40 -30 80 0" stroke="#b86b1e" stroke-width="16" fill="none" stroke-linecap="round"/>
              <!-- sanguchito -->
              <path d="M560 420 L700 200 L840 420 Z" fill="#fde68a" stroke="#8a4b12" stroke-width="18" stroke-linejoin="round"/>
              <path d="M585 395 L700 225 L815 395" fill="none" stroke="#ef4444" stroke-width="22" stroke-linejoin="round"/>
              <!-- carrito -->
              <path d="M120 360 h110 l80 420 h460 l70 -330 H270" fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="300" y="450" width="500" height="290" rx="20" fill="#ffffff"/>
              <path d="M380 500 v190 M470 500 v190 M560 500 v190 M650 500 v190 M740 500 v190" stroke="#15803d" stroke-width="22" stroke-linecap="round"/>
              <circle cx="380" cy="880" r="62" fill="#ffffff"/>
              <circle cx="720" cy="880" r="62" fill="#ffffff"/>
            </g>
          </svg>
          FIN
          cat > iconos/icon-foreground.svg <<'FIN'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
            <g transform="translate(512 540) scale(0.62) translate(-512 -512)">
              <!-- tortita -->
              <ellipse cx="420" cy="330" rx="165" ry="120" fill="#f4b54a" stroke="#8a4b12" stroke-width="18"/>
              <path d="M330 300 q40 -30 80 0 M420 280 q40 -30 80 0 M370 360 q40 -30 80 0" stroke="#b86b1e" stroke-width="16" fill="none" stroke-linecap="round"/>
              <!-- sanguchito -->
              <path d="M560 420 L700 200 L840 420 Z" fill="#fde68a" stroke="#8a4b12" stroke-width="18" stroke-linejoin="round"/>
              <path d="M585 395 L700 225 L815 395" fill="none" stroke="#ef4444" stroke-width="22" stroke-linejoin="round"/>
              <!-- carrito -->
              <path d="M120 360 h110 l80 420 h460 l70 -330 H270" fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="300" y="450" width="500" height="290" rx="20" fill="#ffffff"/>
              <path d="M380 500 v190 M470 500 v190 M560 500 v190 M650 500 v190 M740 500 v190" stroke="#15803d" stroke-width="22" stroke-linecap="round"/>
              <circle cx="380" cy="880" r="62" fill="#ffffff"/>
              <circle cx="720" cy="880" r="62" fill="#ffffff"/>
            </g>
          </svg>
          FIN
          cat > iconos/icon-background.svg <<'FIN'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><defs><linearGradient id="g" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="0.6" stop-color="#15803d"/><stop offset="1" stop-color="#14532d"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#g)"/></svg>
          FIN
          cat > hacer-iconos.js <<'FIN'
          // Convierte los SVG del ícono en PNG de 1024x1024 para @capacitor/assets
          // Uso: node hacer-iconos.js <carpeta-de-los-svg> <carpeta-destino>
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const origen = process.argv[2], destino = process.argv[3];
          fs.mkdirSync(destino, { recursive: true });
          (async () => {
            for (const n of ['icon-only', 'icon-foreground', 'icon-background']) {
              await sharp(path.join(origen, n + '.svg'), { density: 300 })
                .resize(1024, 1024).png().toFile(path.join(destino, n + '.png'));
              console.log('Ícono listo:', n);
            }
          })();
          FIN
          node hacer-iconos.js iconos assets
          npx capacitor-assets generate --android --iconBackgroundColor '#15803d' --iconBackgroundColorDark '#15803d'

      - name: Poner número de versión
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.ver.outputs.version }}\"/" app/android/app/build.gradle
          grep -n "version" app/android/app/build.gradle

      - name: Compilar el APK
        run: |
          cd app
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Compras-del-Taller.apk

      - name: Subir el APK (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: compras-taller-APK
          path: Compras-del-Taller.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Compras del Taller v${{ steps.ver.outputs.version }}
          body: |
            🛒 Compras del Taller v${{ steps.ver.outputs.version }}
            Descargá el archivo Compras-del-Taller.apk de acá abajo e instalalo en tu teléfono.
          files: Compras-del-Taller.apk
          make_latest: true
